# Worker + arquivos estáticos + API do desafio do dia (D1).
# O segredo DAILY_SECRET NÃO fica aqui: wrangler secret put DAILY_SECRET
# Banco: wrangler d1 execute minhalineup --remote --file=worker/schema.sql
name = "meu-jogo"
main = "worker/index.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "minhalineup"
database_id = "30ce705f-7cd4-4673-8958-dcc4778067d1"

# Salas multiplayer (WebSocket + Durable Objects, com SQLite): campeonato
[[durable_objects.bindings]]
name = "CUP"
class_name = "CupRoom"

# Histórico de migrações (não apagar: o Cloudflare confere a sequência).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CupRoom"]

# O duelo 1×1 foi removido: apaga a classe Room e os dados dela.
[[migrations]]
tag = "v3"
deleted_classes = ["Room"]

# Logs persistidos no painel (Workers Logs) — eventos estruturados em JSON (worker/log.js)
[observability]
enabled = true

# Retenção de dados: job diário às 03:17 UTC (ver worker/retention.js e a Política de Privacidade)
[triggers]
crons = ["17 3 * * *"]

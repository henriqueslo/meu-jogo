# Configuração do multiplayer (Fase 1). NÃO substitui o wrangler.toml de produção até o D1 existir.
# Passos: 1) wrangler d1 create minhalineup   2) colar o database_id abaixo
#         3) wrangler d1 execute minhalineup --remote --file=worker/schema.sql
#         4) wrangler secret put DAILY_SECRET --config wrangler.multiplayer.toml
#         5) wrangler deploy --config wrangler.multiplayer.toml
name = "meu-jogo"
main = "worker/index.js"
compatibility_date = "2026-07-01"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "minhalineup"
database_id = "COLE-AQUI-O-ID-DO-D1"
